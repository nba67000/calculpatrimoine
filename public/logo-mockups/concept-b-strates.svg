<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" role="img" aria-label="CalculPatrimoine">
  <!-- Concept B : Strates de patrimoine. 3 blocs décalés horizontalement, le plus haut en or. -->
  <!-- Évoque la stratification du patrimoine (épargne, immobilier, succession). -->
  <g transform="translate(8, 8)">
    <rect x="0"  y="46" width="52" height="14" fill="currentColor" opacity="0.4"/>
    <rect x="6"  y="28" width="52" height="14" fill="currentColor" opacity="0.7"/>
    <rect x="12" y="10" width="52" height="14" fill="#D4AF37"/>
  </g>
  <text x="86" y="48" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="32" letter-spacing="-0.04em" fill="currentColor">
    CalculPatrimoine
  </text>
</svg>
